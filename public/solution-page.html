<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solution</title>

    <!-- KaTeX CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />

    <!-- KaTeX JS -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>

    <!-- Auto Render -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 40px;
        line-height: 1.8;
      }

      .container {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        text-align: left;
        background: white;
        padding: 30px;
        border-radius: 12px;
      }

      .katex-display {
        display: block;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 4px 0;
        text-align: left !important;
      }

      .katex-display > .katex {
        text-align: left !important;
      }

      .katex {
        white-space: normal !important;
      }

      .loading {
        color: #888;
        font-style: italic;
      }

      .error {
        color: #d32f2f;
      }
    </style>
  </head>

  <body>
    <div class="container" id="solution-container">
      <span class="loading">Loading solution...</span>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const appName = params.get("appName");
        const container = document.getElementById("solution-container");

        if (!id || !appName) {
          container.innerHTML =
            '<span class="error">Missing required parameters: id and appName must be provided in the URL.</span>';
          return;
        }

        fetch("/api/solutions/" + id + "/" + appName)
          .then(function (response) {
            if (!response.ok) {
              return response.json().then(function (err) {
                throw new Error(err.error || "Failed to load solution");
              });
            }
            return response.json();
          })
          .then(function (json) {
            var latex = json.data && (json.data.solution || json.data.content || json.data.text);
            if (typeof json.data === "string") {
              latex = json.data;
            }
            if (!latex) {
              throw new Error("Solution content not found in response");
            }
            container.textContent = latex;
            renderMathInElement(container, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "\\(", right: "\\)", display: false },
              ],
            });
          })
          .catch(function (err) {
            container.innerHTML =
              '<span class="error">' + err.message + "</span>";
          });
      });
    </script>
  </body>
</html>
